<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Alex_A Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&family=Kanit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red-dark:#7a0000;--red-main:#b01010;--red-bright:#e02020;--red-accent:#ff4444;
  --gold:#f5a623;--gold-light:#ffd700;
  --dark-bg:#1a0000;--dark-card:#260a0a;--dark-card2:#1f0808;
  --text-light:#f5e6e6;--text-dim:#c8a0a0;
  --green-ok:#22c55e;--border:rgba(200,60,60,0.25);
}
html{scroll-behavior:smooth}
body{font-family:'Sarabun',sans-serif;background:var(--dark-bg);color:var(--text-light);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(ellipse at 20% 20%,rgba(180,20,20,.12) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(100,0,0,.15) 0%,transparent 60%)}
a{text-decoration:none;color:inherit}
img{max-width:100%}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--dark-bg)}
::-webkit-scrollbar-thumb{background:var(--red-main);border-radius:3px}

/* NAVBAR */
.navbar{position:sticky;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;background:linear-gradient(135deg,#1a0000,#2d0808);border-bottom:1px solid var(--border);box-shadow:0 2px 20px rgba(180,0,0,.3)}
.nav-left,.nav-right{display:flex;align-items:center;gap:.75rem}
.logo{font-family:'Kanit',sans-serif;font-weight:900;font-size:1.4rem;background:linear-gradient(135deg,#ff6b6b,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hamburger,.search-btn{background:none;border:none;color:var(--text-light);font-size:1.3rem;cursor:pointer;padding:.3rem;transition:color .2s}
.hamburger:hover,.search-btn:hover{color:var(--gold)}
.balance-chip{display:flex;align-items:center;gap:.4rem;background:linear-gradient(135deg,var(--red-dark),#3d0000);border:1px solid var(--red-accent);border-radius:999px;padding:.4rem 1rem;font-weight:700;color:var(--gold);font-size:.9rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.balance-chip:hover{background:linear-gradient(135deg,var(--red-main),var(--red-dark))}

/* SEARCH */
.search-bar-container{display:none;position:relative;padding:.75rem 1rem;background:var(--dark-card);border-bottom:1px solid var(--border)}
.search-bar-container.visible{display:block}
.search-bar-container input{width:100%;padding:.75rem 1rem;background:var(--dark-bg);border:1px solid var(--border);border-radius:8px;color:var(--text-light);font-family:'Sarabun',sans-serif;font-size:1rem;outline:none}
.search-bar-container input:focus{border-color:var(--red-bright)}
.search-results{position:absolute;top:calc(100% - .75rem);left:1rem;right:1rem;background:var(--dark-card2);border:1px solid var(--border);border-radius:0 0 8px 8px;z-index:200;max-height:300px;overflow-y:auto}
.search-result-item{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;cursor:pointer;transition:background .15s}
.search-result-item:hover{background:rgba(180,0,0,.2)}

/* SIDEBAR */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1001;backdrop-filter:blur(2px)}
.sidebar-overlay.active{display:block}
.sidebar{position:fixed;left:-300px;top:0;bottom:0;width:280px;z-index:1002;background:linear-gradient(180deg,#1a0000,#120000);border-right:1px solid var(--border);transition:left .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;box-shadow:4px 0 30px rgba(0,0,0,.5)}
.sidebar.open{left:0}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1rem;border-bottom:1px solid var(--border)}
.sidebar-logo{font-family:'Kanit',sans-serif;font-weight:900;font-size:1.3rem;background:linear-gradient(135deg,#ff6b6b,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.close-sidebar{background:none;border:none;color:var(--text-dim);font-size:1.2rem;cursor:pointer}
.close-sidebar:hover{color:var(--red-accent)}
.sidebar-nav{padding:1rem 0}
.sidebar-nav a{display:block;padding:.85rem 1.25rem;color:var(--text-light);font-size:1rem;font-weight:500;transition:all .2s}
.sidebar-nav a:hover{background:rgba(180,20,20,.2);color:var(--gold);padding-left:1.75rem}
.sidebar-divider{text-align:center;padding:.5rem 1rem;color:var(--text-dim);font-size:.8rem;border-top:1px solid var(--border);margin-top:.5rem;letter-spacing:1px;text-transform:uppercase}
.sidebar-user-card{margin:.75rem;background:var(--dark-card);border:1px solid var(--border);border-radius:12px;padding:1rem}
.sidebar-user-name{font-weight:700;font-size:1rem;color:var(--text-light);margin-bottom:.25rem}
.sidebar-user-balance{color:var(--gold);font-size:.9rem}
.sidebar-user-links{padding:0 0 1rem}
.sidebar-user-links a{display:block;padding:.75rem 1.25rem;color:var(--text-dim);font-size:.95rem;transition:all .2s}
.sidebar-user-links a:hover{color:var(--gold);background:rgba(180,20,20,.15)}

/* MAIN */
.main-content{padding-bottom:3rem}
.page{display:none;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* HERO */
.hero-banner{position:relative;overflow:hidden;min-height:300px;background:linear-gradient(135deg,#3d0000,#800000,#1a0000);display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem}
.hero-particles{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,100,100,.15) 1px,transparent 1px);background-size:30px 30px;animation:particleMove 20s linear infinite}
@keyframes particleMove{from{transform:translateY(0)}to{transform:translateY(-30px)}}
.hero-content{position:relative;text-align:center;max-width:600px}
.hero-title{font-family:'Kanit',sans-serif;font-weight:900;font-size:clamp(2rem,8vw,3.5rem);background:linear-gradient(135deg,#fff,var(--gold),#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1;margin-bottom:.5rem;filter:drop-shadow(0 0 20px rgba(255,100,100,.4))}
.hero-subtitle{font-size:1.1rem;color:var(--gold);font-weight:700;margin-bottom:.5rem}
.hero-desc{color:var(--text-dim);font-size:.95rem;margin-bottom:1.5rem}
.hero-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

/* BUTTONS */
.btn-primary{background:linear-gradient(135deg,var(--red-bright),var(--red-dark));color:#fff;border:none;border-radius:999px;padding:.75rem 1.75rem;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Sarabun',sans-serif;box-shadow:0 4px 15px rgba(180,0,0,.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(180,0,0,.6)}
.btn-secondary{background:transparent;color:var(--text-light);border:2px solid rgba(255,255,255,.4);border-radius:999px;padding:.75rem 1.75rem;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Sarabun',sans-serif}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#c8820a);color:#1a0000;border:none;border-radius:999px;padding:.6rem 1.5rem;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Sarabun',sans-serif}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(245,166,35,.4)}
.full-width{width:100%;margin-top:.5rem}

/* ANNOUNCEMENT */
.announcement-banner{margin:1rem;background:linear-gradient(135deg,#1a0a00,#2d1500);border:2px solid var(--gold);border-radius:16px;padding:1.25rem;box-shadow:0 0 20px rgba(245,166,35,.2)}
.announce-inner{text-align:center}
.announce-icon{font-size:1.5rem}
.announce-inner strong{display:block;color:var(--gold);font-size:1.1rem;margin:.5rem 0}
.announce-inner p{color:var(--text-dim);font-size:.9rem;margin-bottom:1rem}
.announce-btn{background:linear-gradient(135deg,var(--gold),#c8820a);color:#1a0000;border:none;border-radius:999px;padding:.6rem 1.5rem;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:.95rem}

/* READ BEFORE BUY */
.read-before-buy{margin:1rem;background:var(--dark-card);border-radius:12px;padding:1.25rem;border:1px solid var(--border);text-align:center}
.read-before-buy h2{color:var(--gold);margin-bottom:.75rem;font-size:1.3rem}
.read-before-buy p{color:var(--text-dim);margin-bottom:.5rem;font-size:.95rem}

/* STATS */
.stats-section{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;margin:1rem}
.stat-card{background:var(--dark-card);border:1px solid var(--border);border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem}
.stat-icon{font-size:2rem}
.stat-label{font-size:.8rem;color:var(--text-dim)}
.stat-value{font-family:'Kanit',sans-serif;font-size:1.5rem;font-weight:800;color:var(--red-accent)}
.stat-sub{font-size:.75rem;color:var(--text-dim)}

/* SECTION HEADER */
.section-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1rem .5rem}
.section-header h2{font-family:'Kanit',sans-serif;font-size:1.2rem;font-weight:700}
.see-more-btn{background:var(--dark-card);border:1px solid var(--border);color:var(--text-light);border-radius:8px;padding:.4rem .9rem;font-size:.85rem;cursor:pointer;font-family:'Sarabun',sans-serif;transition:all .2s}
.see-more-btn:hover{border-color:var(--gold);color:var(--gold)}

/* CATEGORY CARDS */
.category-cards{display:flex;flex-direction:column;gap:1rem;padding:.5rem 1rem}
.category-card{background:var(--dark-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:all .25s}
.category-card:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(180,0,0,.3);border-color:var(--red-accent)}
.category-card-img{width:100%;height:140px;object-fit:cover;display:block;background:var(--dark-card2)}
.category-card-img-placeholder{width:100%;height:140px;background:linear-gradient(135deg,var(--red-dark),#3d0000);display:flex;align-items:center;justify-content:center;font-size:3rem}
.category-card-info{padding:1rem}
.category-card-name{font-weight:700;font-size:1.05rem;margin-bottom:.25rem}
.category-card-count{color:var(--text-dim);font-size:.85rem;margin-bottom:.75rem}

/* CATEGORY GRID */
.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;padding:1rem}
.category-grid-item{background:var(--dark-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s}
.category-grid-item:hover{border-color:var(--red-accent)}
.category-grid-item img{width:100%;height:100px;object-fit:cover}
.category-grid-item-name{padding:.6rem;font-weight:600;font-size:.9rem}

/* PRODUCTS GRID */
.products-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;padding:0 1rem 1rem}
@media(min-width:600px){.products-grid{grid-template-columns:repeat(3,1fr)}}
.product-card{background:var(--dark-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .25s;position:relative}
.product-card:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(180,0,0,.3);border-color:var(--red-accent)}
.product-badge{position:absolute;top:.5rem;left:.5rem;background:var(--red-bright);color:#fff;font-size:.65rem;font-weight:700;padding:.2rem .5rem;border-radius:4px}
.product-card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--dark-card2)}
.product-img-placeholder{width:100%;aspect-ratio:1;background:linear-gradient(135deg,var(--red-dark),#3d0000);display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.product-card-body{padding:.75rem}
.product-card-name{font-weight:700;font-size:.85rem;margin-bottom:.25rem;line-height:1.3}
.product-card-price{color:var(--red-accent);font-weight:800;font-size:1rem}
.product-card-original{color:var(--text-dim);font-size:.75rem;text-decoration:line-through}
.product-card-stock{color:var(--text-dim);font-size:.75rem}

/* PRODUCT DETAIL */
.product-detail-container{padding:1rem}
.product-detail-img{width:100%;border-radius:16px;max-height:250px;object-fit:cover}
.product-detail-img-placeholder{width:100%;height:220px;background:linear-gradient(135deg,var(--red-dark),#3d0000);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:5rem;margin-bottom:1rem}
.product-detail-name{font-family:'Kanit',sans-serif;font-size:1.5rem;font-weight:800;margin:1rem 0 .5rem}
.product-detail-price{font-size:1.8rem;font-weight:900;color:var(--red-accent);margin-bottom:.5rem}
.product-detail-desc{color:var(--text-dim);margin-bottom:1rem;line-height:1.6}
.product-detail-stock{color:var(--text-dim);font-size:.9rem;margin-bottom:1.5rem}

/* PAGE HEADER */
.page-header{padding:1.25rem 1rem .5rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.page-header h1{font-family:'Kanit',sans-serif;font-size:1.6rem;font-weight:800}
.page-header p{color:var(--text-dim);font-size:.9rem}
.breadcrumb{color:var(--text-dim);font-size:.8rem;margin-bottom:.5rem;cursor:pointer}
.discount-badge{background:linear-gradient(135deg,var(--gold),#c8820a);color:#1a0000;font-weight:800;font-size:.7rem;padding:.15rem .4rem;border-radius:4px}

/* TOPUP */
.topup-methods{display:flex;flex-direction:column;gap:1rem;padding:0 1rem}
.topup-card{background:var(--dark-card);border:1px solid var(--border);border-radius:16px;padding:2rem 1.5rem;text-align:center;cursor:pointer;transition:all .25s;width:100%;-webkit-tap-highlight-color:transparent}
.topup-card:hover,.topup-card:active{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 25px rgba(180,0,0,.3)}
.topup-icon{font-size:3.5rem;margin-bottom:.75rem}
.topup-card h3{font-size:1.1rem;font-weight:700;margin-bottom:.5rem}
.topup-fee{font-size:.85rem;color:var(--text-dim);display:flex;align-items:center;justify-content:center;gap:.4rem}
.fee-badge{background:var(--green-ok);color:#fff;font-size:.7rem;font-weight:700;padding:.15rem .4rem;border-radius:4px}
.topup-form-section{margin:1.5rem 1rem 0;background:var(--dark-card);border:1px solid var(--border);border-radius:16px;padding:1.25rem}
.topup-form-section h3{margin-bottom:1rem;color:var(--gold)}
.topup-status{margin-top:.75rem;padding:.75rem;border-radius:8px;font-size:.9rem;display:none;white-space:pre-line;line-height:1.5}
.topup-status.success{background:rgba(34,197,94,.15);color:var(--green-ok);border:1px solid var(--green-ok);display:block}
.topup-status.error{background:rgba(239,68,68,.15);color:#f87171;border:1px solid #f87171;display:block}
.topup-status.loading{background:rgba(245,166,35,.1);color:var(--gold);border:1px solid var(--gold);display:block}

/* CONTACT */
.contact-cards{padding:0 1rem;display:flex;flex-direction:column;gap:1rem}
.contact-card{display:flex;align-items:center;gap:1.25rem;background:var(--dark-card);border:1px solid var(--border);border-radius:16px;padding:1.25rem;transition:all .2s;cursor:pointer}
.contact-card:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
.contact-card.facebook{border-color:rgba(24,119,242,.4)}
.contact-card.facebook:hover{border-color:#1877f2;box-shadow:0 8px 25px rgba(24,119,242,.25)}
.contact-card img{width:56px;height:56px;object-fit:contain;border-radius:12px;flex-shrink:0}
.contact-card h3{font-weight:700;margin-bottom:.25rem;font-size:1.05rem}
.contact-card p{color:var(--text-dim);font-size:.85rem}

/* PROFILE & ADMIN TABS */
.profile-tabs,.admin-tabs{display:flex;gap:.5rem;overflow-x:auto;padding:.75rem 1rem;border-bottom:1px solid var(--border);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.profile-tabs::-webkit-scrollbar,.admin-tabs::-webkit-scrollbar{display:none}
.tab-btn{white-space:nowrap;flex-shrink:0;background:var(--dark-card);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:.55rem 1rem;font-size:.85rem;cursor:pointer;transition:all .2s;font-family:'Sarabun',sans-serif;-webkit-tap-highlight-color:transparent}
.tab-btn.active{background:var(--red-main);color:#fff;border-color:var(--red-bright)}
.tab-btn:hover:not(.active){border-color:var(--red-accent);color:var(--text-light)}

/* PROFILE */
.profile-info-card{margin:1rem;background:var(--dark-card);border:1px solid var(--border);border-radius:16px;padding:1.25rem}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--red-bright),var(--red-dark));display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;color:#fff;margin-bottom:1rem}
.profile-username{font-family:'Kanit',sans-serif;font-size:1.4rem;font-weight:800}
.profile-email{color:var(--text-dim);font-size:.9rem}
.profile-balance{color:var(--gold);font-size:1.1rem;font-weight:700;margin-top:.5rem}

/* HISTORY */
.history-item{margin:0 1rem .75rem;background:var(--dark-card);border:1px solid var(--border);border-radius:12px;padding:1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.history-item-left{display:flex;align-items:center;gap:.75rem;flex:1}
.history-item-icon{font-size:1.5rem;min-width:36px;text-align:center}
.history-item-name{font-weight:600;font-size:.95rem}
.history-item-date{color:var(--text-dim);font-size:.8rem}
.history-item-amount{font-weight:800;white-space:nowrap}
.badge-success{background:rgba(34,197,94,.15);color:var(--green-ok);padding:.2rem .6rem;border-radius:4px;font-size:.75rem;font-weight:700}
.badge-pending{background:rgba(245,166,35,.15);color:var(--gold);padding:.2rem .6rem;border-radius:4px;font-size:.75rem;font-weight:700}

/* COUPON */
.coupon-section{margin:1rem}
.coupon-section h3{margin-bottom:.75rem;color:var(--gold)}
.coupon-input-row{display:flex;gap:.5rem}
.coupon-input-row input{flex:1;padding:.75rem 1rem;background:var(--dark-card);border:1px solid var(--border);border-radius:8px;color:var(--text-light);font-family:'Sarabun',sans-serif;font-size:1rem;outline:none}
.coupon-input-row input:focus{border-color:var(--gold)}
.coupon-card{background:linear-gradient(135deg,var(--dark-card2),var(--dark-card));border:1px dashed var(--gold);border-radius:12px;padding:1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.coupon-code{font-family:'Kanit',sans-serif;font-weight:700;color:var(--gold);font-size:1.1rem}
.coupon-discount{color:var(--red-accent);font-weight:700}

/* ADMIN */
.admin-dashboard{padding:1rem;display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.admin-stat-card{background:var(--dark-card);border:1px solid var(--border);border-radius:12px;padding:1rem}
.admin-stat-card .label{color:var(--text-dim);font-size:.8rem;margin-bottom:.25rem}
.admin-stat-card .value{font-family:'Kanit',sans-serif;font-size:1.6rem;font-weight:800;color:var(--red-accent)}
.admin-section{padding:1rem}
.admin-section h3{margin-bottom:1rem;color:var(--gold)}
.admin-form{background:var(--dark-card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.admin-form h4{margin-bottom:1rem;color:var(--gold)}
.admin-table{width:100%;border-collapse:collapse}
.admin-table th{background:var(--dark-card2);padding:.6rem;text-align:left;font-size:.8rem;color:var(--text-dim);border-bottom:1px solid var(--border)}
.admin-table td{padding:.7rem .6rem;border-bottom:1px solid var(--border);font-size:.85rem}
.admin-table tr:hover td{background:rgba(180,0,0,.1)}
.action-btn{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:.3rem .7rem;font-size:.75rem;cursor:pointer;transition:all .15s;font-family:'Sarabun',sans-serif}
.action-btn:hover{border-color:var(--red-accent);color:var(--red-accent)}
.action-btn.danger:hover{border-color:#f87171;color:#f87171}
.action-btn.success-btn:hover{border-color:var(--green-ok);color:var(--green-ok)}

/* FORM */
.form-group{margin-bottom:1rem}
.form-group label{display:block;margin-bottom:.4rem;font-size:.9rem;color:var(--text-dim);font-weight:6้ใช้"/></div>
      <div class="form-group"><label>รหัสผ่าน</label><input type="password" id="regPass" class="form-input" placeholder="รหัสผ่าน"/></div>
      <div class="form-group"><label>อีเมล</label><input type="email" id="regEmail" class="form-input" placeholder="email@example.com"/></div>
      <button class="btn-primary full-width" onclick="register()">สมัครสมาชิก</button>
      <div id="registerError" class="error-msg"></div>
    </div>
  </div>
</div>

<!-- BUY MODAL -->
<div class="modal-overlay" id="buyModal" style="display:none">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('buyModal')">✕</button>
    <h2>🛒 ยืนยันการซื้อ</h2>
    <div id="buyModalContent"></div>
    <button class="btn-primary full-width" onclick="confirmBuy()">✅ ยืนยันซื้อสินค้า</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
/* ============================================================
   Alex_A Shop — app.js  v4 (Clean)
   ============================================================ */

const ADMIN = { username:'Alex', password:'spxh_7aHaf_58Ak' };

const LS = {
  get:    k     => { try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },
  set:    (k,v) => localStorage.setItem(k, JSON.stringify(v)),
  remove: k     => localStorage.removeItem(k),
};

let currentUser       = null;
let pendingBuyProduct = null;
let appliedCoupon     = null;

/* ── SEED ───────────────────────────────────────────────────── */
function seedData() {
  if (!LS.get('alexa_users'))     LS.set('alexa_users', []);
  if (!LS.get('alexa_topups'))    LS.set('alexa_topups', []);
  if (!LS.get('alexa_purchases')) LS.set('alexa_purchases', []);

  if (!LS.get('alexa_payment_settings')) {
    LS.set('alexa_payment_settings', {
      truewallet: { enabled:true, phone:'0954326060', name:'Alex_A Shop' },
    });
  }
  if (!LS.get('alexa_coupons')) {
    LS.set('alexa_coupons', [
      { code:'ALEX10', discount:10, type:'percent', active:true },
      { code:'FREE50', discount:50, type:'fixed',   active:true },
    ]);
  }
  if (!LS.get('alexa_categories')) {
    LS.set('alexa_categories', [
      { id:'cat1', name:'กล่องสุ่ม',       icon:'📦', img:'' },
      { id:'cat2', name:'ไอดีไก่ตัน',     icon:'🐔', img:'' },
      { id:'cat3', name:'ไอดีสัตว์เลี้ยง', icon:'🐾', img:'' },
      { id:'cat4', name:'Sailor Piece',    icon:'⚔️', img:'' },
    ]);
  }
  if (!LS.get('alexa_products')) {
    LS.set('alexa_products', [
      { id:'p1', name:'ไก่ตัน ไซบอก V4 T10 ดาบคู่', price:299, originalPrice:399, stock:0, sold:0, category:'cat2', img:'', desc:'ไก่ตันคุณภาพสูง การันตีเข้าได้', credentials:[] },
      { id:'p2', name:'กล่องสุ่ม Premium Pack',       price:89,  originalPrice:120, stock:0, sold:0, category:'cat1', img:'', desc:'กล่องสุ่มพรีเมียม', credentials:[] },
    ]);
  }
}

function getPS() {
  return LS.get('alexa_payment_settings') || { truewallet:{ enabled:true, phone:'0954326060', name:'Alex_A Shop' } };
}
function savePS(ps) { LS.set('alexa_payment_settings', ps); }

/* ── INIT ───────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  seedData();
  loadCurrentUser();
  renderStats();
  renderHomeCategoryCards();
  renderSidebarUser();
  updateNavBalance();
  showPage('home');

  document.getElementById('menuToggle').onclick = () => {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('active');
  };
  document.getElementById('searchToggle').onclick = () => {
    const b = document.getElementById('searchBar');
    b.classList.toggle('visible');
    if (b.classList.contains('visible')) document.getElementById('searchInput').focus();
  };
  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target===o) o.style.display='none'; });
  });
});

/* ── NAVIGATION ─────────────────────────────────────────────── */
function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const el = document.getElementById('page-'+page);
  if (!el) return;
  el.classList.add('active');
  window.scrollTo({ top:0, behavior:'smooth' });
  if (page==='products') { renderCategoryGrid(); renderProductsGrid(); }
  if (page==='topup')    { initTopupPage(); }
  if (page==='profile')  { renderProfile(); }
  if (page==='admin')    { switchAdminTab('dashboard'); }
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
}

/* ── SEARCH ─────────────────────────────────────────────────── */
function searchProducts() {
  const q  = document.getElementById('searchInput').value.trim().toLowerCase();
  const el = document.getElementById('searchResults');
  if (!q) { el.innerHTML=''; return; }
  const cats = LS.get('alexa_categories')||[];
  const prods= LS.get('alexa_products')||[];
  const f    = prods.filter(p=>p.name.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q));
  if (!f.length) { el.innerHTML=`<div style="padding:1rem;color:var(--text-dim)">ไม่พบสินค้า</div>`; return; }
  el.innerHTML = f.slice(0,5).map(p=>{
    const cat = cats.find(c=>c.id===p.category);
    return `<div class="search-result-item" onclick="openProductDetail('${p.id}');document.getElementById('searchBar').classList.remove('visible')">
      <div style="font-size:1.8rem">${cat?cat.icon:'🎮'}</div>
      <div><div style="font-weight:600;font-size:.9rem">${p.name}</div>
      <div style="color:var(--red-accent);font-weight:700">${p.price.toLocaleString()} บาท</div></div>
    </div>`;
  }).join('');
}

/* ── AUTH ───────────────────────────────────────────────────── */
function showAuthModal(tab) { document.getElementById('authModal').style.display='flex'; switchAuthTab(tab||'login'); }
function closeModal(id) { document.getElementById(id).style.display='none'; }

function switchAuthTab(tab) {
  document.getElementById('loginForm').style.display    = tab==='login'    ? 'block':'none';
  document.getElementById('registerForm').style.display = tab==='register' ? 'block':'none';
  document.getElementById('tabLogin').classList.toggle('active',    tab==='login');
  document.getElementById('tabRegister').classList.toggle('active', tab==='register');
  document.getElementById('loginError').textContent='';
  document.getElementById('registerError').textContent='';
}

function login() {
  const user=document.getElementById('loginUser').value.trim();
  const pass=document.getElementById('loginPass').value;
  const err =document.getElementById('loginError');
  if (!user||!pass) { err.textContent='⚠️ กรุณากรอกชื่อและรหัสผ่าน'; return; }
  if (user===ADMIN.username && pass===ADMIN.password) {
    currentUser={username:ADMIN.username,email:'admin@alexashop.com',balance:0,isAdmin:true};
    LS.set('alexa_session',currentUser); afterLogin(); return;
  }
  const users=LS.get('alexa_users')||[];
  const found=users.find(u=>u.username===user&&u.password===pass);
  if (!found) { err.textContent='❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'; return; }
  currentUser={username:found.username,email:found.email,balance:found.balance,isAdmin:false};
  LS.set('alexa_session',currentUser); afterLogin();
}

function register() {
  const name =document.getElementById('regName').value.trim();
  const pass =document.getElementById('regPass').value;
  const email=document.getElementById('regEmail').value.trim();
  const err  =document.getElementById('registerError');
  if (!name||!pass||!email) { err.textContent='⚠️ กรุณากรอกข้อมูลให้ครบ'; return; }
  if (name===ADMIN.username) { err.textContent='❌ ชื่อผู้ใช้นี้ไม่สามารถใช้ได้'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent='⚠️ รูปแบบอีเมลไม่ถูกต้อง'; return; }
  const users=LS.get('alexa_users')||[];
  if (users.find(u=>u.username===name))  { err.textContent='❌ ชื่อผู้ใช้นี้ถูกใช้แล้ว'; return; }
  if (users.find(u=>u.email===email))    { err.textContent='❌ อีเมลนี้ถูกใช้แล้ว'; return; }
  users.push({username:name,password:pass,email,balance:0,joinDate:new Date().toLocaleString('th-TH')});
  LS.set('alexa_users',users);
  currentUser={username:name,email,balance:0,isAdmin:false};
  LS.set('alexa_session',currentUser); afterLogin();
}

function afterLogin() {
  closeModal('authModal');
  renderSidebarUser(); updateNavBalance(); renderStats();
  showToast(`✅ ยินดีต้อนรับ ${currentUser.username}!`,'success');
  if (currentUser.isAdmin) showPage('admin');
}

function logout() {
  currentUser=null; LS.remove('alexa_session');
  renderSidebarUser(); updateNavBalance(); closeSidebar(); showPage('home');
  showToast('👋 ออกจากระบบแล้ว');
}

function loadCurrentUser() {
  const s=LS.get('alexa_session');
  if (!s) return;
  if (s.isAdmin) { currentUser=s; return; }
  const u=(LS.get('alexa_users')||[]).find(u=>u.username===s.username);
  if (u) currentUser={...s,balance:u.balance};
  else LS.remove('alexa_session');
}

function updateNavBalance() {
  const el=document.getElementById('navBalance');
  const chip=document.getElementById('balanceChip');
  if (currentUser&&currentUser.isAdmin) { el.textContent='Admin'; chip.onclick=()=>showPage('admin'); }
  else if (currentUser) { el.textContent=currentUser.balance.toLocaleString(); chip.onclick=()=>{showPage('profile');switchProfileTab('info');}; }
  else { el.textContent='0'; chip.onclick=()=>showAuthModal('login'); }
}

function renderSidebarUser() {
  const el=document.getElementById('sidebarUserSection');
  if (!currentUser) {
    el.innerHTML=`<div style="padding:0 1rem 1rem">
      <button class="btn-primary full-width" onclick="showAuthModal('login');closeSidebar()">🔐 เข้าสู่ระบบ</button>
      <button class="btn-secondary full-width" style="margin-top:.5rem" onclick="showAuthModal('register');closeSidebar()">📝 สมัครสมาชิก</button>
    </div>`; return;
  }
  if (currentUser.isAdmin) {
    el.innerHTML=`<div class="sidebar-user-card">
      <div class="sidebar-user-name">🔐 ${currentUser.username}</div>
      <div style="color:var(--red-accent);font-size:.8rem">Administrator</div>
    </div>
    <div class="sidebar-user-links">
      <a href="#" onclick="showPage('admin');closeSidebar()">📊 Admin Panel</a>
      <a href="#" onclick="logout()">↩️ ออกจากระบบ</a>
    </div>`; return;
  }
  el.innerHTML=`<div class="sidebar-user-card">
    <div class="sidebar-user-name">${currentUser.username}</div>
    <div class="sidebar-user-balance">🪙 ${currentUser.balance.toLocaleString()} บาท</div>
  </div>
  <div class="sidebar-user-links">
    <a href="#" onclick="showPage('profile');switchProfileTab('info');closeSidebar()">👤 โปรไฟล์</a>
    <a href="#" onclick="showPage('profile');switchProfileTab('settings');closeSidebar()">⚙️ การตั้งค่า</a>
    <a href="#" onclick="showPage('profile');switchProfileTab('topup-history');closeSidebar()">💰 ประวัติเติมเงิน</a>
    <a href="#" onclick="showPage('profile');switchProfileTab('purchase-history');closeSidebar()">🛒 ประวัติการซื้อ</a>
    <a href="#" onclick="showPage('profile');switchProfileTab('coupon');closeSidebar()">🎟️ ระบบคูปอง</a>
    <a href="#" onclick="logout()">↩️ ออกจากระบบ</a>
  </div>`;
}

/* ── STATS ──────────────────────────────────────────────────── */
function renderStats() {
  const users   = LS.get('alexa_users')||[];
  const prods   = LS.get('alexa_products')||[];
  const sold    = prods.reduce((a,p)=>a+(p.sold||0),0);
  anim('statUsers',users.length); anim('statProducts',prods.length); anim('statSold',sold);
}
function anim(id,target) {
  const el=document.getElementById(id); if(!el) return;
  let cur=0; const step=Math.max(1,Math.ceil(target/40));
  const t=setInterval(()=>{ cur=Math.min(cur+step,target); el.textContent=cur.toLocaleString(); if(cur>=target) clearInterval(t); },30);
}

/* ── HOME ───────────────────────────────────────────────────── */
function renderHomeCategoryCards() {
  const cats =LS.get('alexa_categories')||[];
  const prods=LS.get('alexa_products')||[];
  const el=document.getElementById('homeCategoryCards'); if(!el) return;
  el.innerHTML=cats.map(cat=>{
    const count=prods.filter(p=>p.category===cat.id).length;
    return `<div class="category-card" onclick="filterByCategory('${cat.id}')">
      ${cat.img?`<img class="category-card-img" src="${cat.img}" alt="${cat.name}">`:`<div class="category-card-img-placeholder">${cat.icon}</div>`}
      <div class="category-card-info">
        <div class="category-card-name">${cat.icon} ${cat.name}</div>
        <div class="category-card-count">มีสินค้าทั้งหมด ${count} ชิ้น</div>
        <button class="btn-primary" style="padding:.5rem 1.25rem;font-size:.9rem">สินค้าทั้งหมด</button>
      </div>
    </div>`;
  }).join('');
}

/* ── PRODUCTS ───────────────────────────────────────────────── */
function renderCategoryGrid() {
  const cats =LS.get('alexa_categories')||[];
  const prods=LS.get('alexa_products')||[];
  const el=document.getElementById('categoryGrid'); if(!el) return;
  el.innerHTML=cats.map(cat=>{
    const count=prods.filter(p=>p.category===cat.id).length;
    return `<div class="category-grid-item" onclick="filterByCategory('${cat.id}')">
      ${cat.img?`<img src="${cat.img}" alt="${cat.name}">`:`<div style="width:100%;height:100px;background:linear-gradient(135deg,var(--red-dark),#3d0000);display:flex;align-items:center;justify-content:center;font-size:2.5rem">${cat.icon}</div>`}
      <div class="category-grid-item-name">${cat.name} <span style="color:var(--text-dim);font-size:.75rem">(${count})</span></div>
    </div>`;
  }).join('');
}

let activeCategory=null;
function filterByCategory(catId) { activeCategory=catId; showPage('products'); renderProductsGrid(); }

function renderProductsGrid() {
  const el=document.getElementById('productsGrid'); if(!el) return;
  const prods=LS.get('alexa_products')||[];
  const cats =LS.get('alexa_categories')||[];
  const f=activeCategory?prods.filter(p=>p.category===activeCategory):prods;
  if (!f.length) { el.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📦</div><p>ไม่มีสินค้าในหมวดนี้</p></div>`; return; }
  el.innerHTML=f.map(p=>{
    const cat=cats.find(c=>c.id===p.category);
    const disc=p.originalPrice>p.price?Math.round((1-p.price/p.originalPrice)*100):0;
    return `<div class="product-card" onclick="openProductDetail('${p.id}')">
      ${disc?`<div class="product-badge">-${disc}%</div>`:''}
      ${p.img?`<img src="${p.img}" alt="${p.name}">`:`<div class="product-img-placeholder">${cat?cat.icon:'🎮'}</div>`}
      <div class="product-card-body">
        <div class="product-card-name">${p.name}</div>
        <div class="product-card-price">${p.price.toLocaleString()} บาท</div>
        ${p.originalPrice>p.price?`<div class="product-card-original">${p.originalPrice.toLocaleString()} บาท</div>`:''}
        <div class="product-card-stock">คงเหลือ: ${p.stock} ชิ้น</div>
      </div>
    </div>`;
  }).join('');
}

function openProductDetail(pid) {
  const prods=LS.get('alexa_products')||[];
  const cats =LS.get('alexa_categories')||[];
  const p=prods.find(x=>x.id===pid); if(!p) return;
  const cat=cats.find(c=>c.id===p.category);
  const disc=p.originalPrice>p.price?Math.round((1-p.price/p.originalPrice)*100):0;
  document.getElementById('detailBreadcrumb').textContent=`🏠 หน้าแรก › สินค้า › ${p.name}`;
  document.getElementById('productDetailContent').innerHTML=`
    ${p.img?`<img class="product-detail-img" src="${p.img}" alt="${p.name}">`:`<div class="product-detail-img-placeholder">${cat?cat.icon:'🎮'}</div>`}
    <div class="product-detail-name">${p.name}</div>
    <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.5rem">
      <div class="product-detail-price">${p.price.toLocaleString()} บาท</div>
      ${p.originalPrice>p.price?`<div style="color:var(--text-dim);text-decoration:line-through">${p.originalPrice.toLocaleString()} บาท</div>`:''}
      ${disc?`<span class="discount-badge">-${disc}%</span>`:''}
    </div>
    <div class="product-detail-stock">📦 คงเหลือ: ${p.stock} ชิ้น | ขายแล้ว: ${p.sold} ชิ้น</div>
    <div class="product-detail-desc">${p.desc}</div>
    <button class="btn-primary full-width" style="margin-top:.75rem" onclick="initBuy('${p.id}')">🛒 ซื้อสินค้า</button>
    <button class="btn-secondary full-width" style="margin-top:.5rem" onclick="showPage('products')">← กลับ</button>`;
  showPage('product-detail');
}

/* ── BUY FLOW ───────────────────────────────────────────────── */
function initBuy(pid) {
  if (!currentUser) { showAuthModal('login'); return; }
  if (currentUser.isAdmin) { showToast('⚠️ แอดมินไม่สามารถซื้อสินค้าได้','error'); return; }
  const prods=LS.get('alexa_products')||[];
  const p=prods.find(x=>x.id===pid); if(!p) return;
  if (p.stock<=0) { showToast('❌ สินค้าหมดแล้ว','error'); return; }
  pendingBuyProduct=p; appliedCoupon=null;
  document.getElementById('buyModalContent').innerHTML=`
    <div style="background:var(--dark-card2);border-radius:10px;padding:1rem;margin-bottom:1rem">
      <div style="font-weight:700;margin-bottom:.5rem">${p.name}</div>
      <div style="color:var(--red-accent);font-weight:800;font-size:1.2rem" id="buyFinalPrice">${p.price.toLocaleString()} บาท</div>
      <div style="color:var(--text-dim);font-size:.85rem">ยอดเงินของคุณ: ${currentUser.balance.toLocaleString()} บาท</div>
    </div>
    <div style="margin-bottom:1rem">
      <label style="display:block;margin-bottom:.4rem;font-size:.9rem;color:var(--text-dim);font-weight:600">🎟️ คูปองส่วนลด</label>
      <div style="display:flex;gap:.5rem">
        <input type="text" id="buyCouponInput" placeholder="กรอกรหัสคูปอง" class="form-input" style="flex:1">
        <button class="btn-gold" onclick="applyCouponOnBuy()">ใช้</button>
      </div>
      <div id="buyCouponMsg" style="font-size:.85rem;margin-top:.4rem"></div>
    </div>`;
  document.getElementById('buyModal').style.display='flex';
}

function applyCouponOnBuy() {
  const code=(document.getElementById('buyCouponInput').value||'').trim().toUpperCase();
  const c=(LS.get('alexa_coupons')||[]).find(x=>x.code===code&&x.active);
  const msgEl=document.getElementById('buyCouponMsg');
  const priceEl=document.getElementById('buyFinalPrice');
  if (!c) { msgEl.innerHTML=`<span style="color:#f87171">❌ คูปองไม่ถูกต้อง</span>`; appliedCoupon=null; priceEl.textContent=`${pendingBuyProduct.price.toLocaleString()} บาท`; return; }
  appliedCoupon=c;
  priceEl.textContent=`${calcFinalPrice(pendingBuyProduct.price,c).toLocaleString()} บาท`;
  msgEl.innerHTML=`<span style="color:var(--green-ok)">✅ ใช้คูปอง ${c.code} สำเร็จ</span>`;
}

function calcFinalPrice(price,coupon) {
  if (!coupon) return price;
  return coupon.type==='percent' ? Math.max(0,Math.round(price*(1-coupon.discount/100))) : Math.max(0,price-coupon.discount);
}

function confirmBuy() {
  if (!pendingBuyProduct||!currentUser) return;
  const p=pendingBuyProduct;
  const finalPrice=calcFinalPrice(p.price,appliedCoupon);
  if (currentUser.balance<finalPrice) { showToast('❌ ยอดเงินไม่เพียงพอ','error'); closeModal('buyModal'); showPage('topup'); return; }

  const prods=LS.get('alexa_products')||[];
  const pi=prods.findIndex(x=>x.id===p.id);
  let cred=null;
  if (pi!==-1) {
    const arr=prods[pi].credentials||[];
    if (arr.length>0) { cred=arr.shift(); prods[pi].credentials=arr; }
    prods[pi].stock=Math.max(0,prods[pi].stock-1);
    prods[pi].sold=(prods[pi].sold||0)+1;
  }
  LS.set('alexa_products',prods);

  currentUser.balance-=finalPrice; LS.set('alexa_session',currentUser);
  const users=LS.get('alexa_users')||[];
  const ui=users.findIndex(u=>u.username===currentUser.username);
  if (ui!==-1) { users[ui].balance=currentUser.balance; LS.set('alexa_users',users); }

  const purch=LS.get('alexa_purchases')||[];
  purch.unshift({ id:'pur_'+Date.now(), username:currentUser.username, productId:p.id, productName:p.name, price:finalPrice, coupon: 1rem 1rem">
      <div style="background:linear-gradient(135deg,#1a0a00,#2d1500);border:1px solid var(--gold);border-radius:12px;padding:1rem">
        <div style="color:var(--gold);font-weight:700;margin-bottom:.5rem">📱 เบอร์รับอังเป๋าปัจจุบัน</div>
        <div style="font-size:1.4rem;font-weight:900;letter-spacing:3px">${ps.truewallet.phone||'(ยังไม่ได้ตั้งค่า)'}</div>
        <div style="color:var(--text-dim);font-size:.85rem;margin-top:.25rem">${ps.truewallet.name||''}</div>
        <button class="btn-gold" style="margin-top:.75rem" onclick="switchAdminTab('settings')">✏️ แก้ไขเบอร์</button>
      </div>
    </div>`;
}

/* PRODUCTS — เขียนด้วย DOM จริง ไม่ใช้ inline onclick ใน template */

  if (!requireAdmin()) return;
  const wrap=document.getElementById('adminTabContent');
  wrap.innerHTML='';

  const section=document.createElement('div');
  section.className='admin-section';

  /* --- ฟอร์มเพิ่มสินค้า --- */
  const addForm=document.createElement('div');
  addForm.className='admin-form';
  addForm.innerHTML=`
    <h4>➕ เพิ่มสินค้าใหม่</h4>
    <div class="grid-2">
      <div class="form-group"><label>ชื่อสินค้า <span style="color:var(--red-accent)">*</span></label><input type="text" id="ap_name" class="form-input" placeholder="ชื่อสินค้า"></div>
      <div class="form-group"><label>ราคา (บาท) <span style="color:var(--red-accent)">*</span></label><input type="number" id="ap_price" class="form-input" placeholder="0" min="0"></div>
    </div>

function adminAddProduct() {
  const msg  = document.getElementById('addProductMsg');
  const name = (document.getElementById('ap_name')?.value||'').trim();
  const price= parseInt(document.getElementById('ap_price')?.value||'0');
  const orig = parseInt(document.getElementById('ap_orig')?.value||'0')||price;
  const cat  = document.getElementById('ap_cat')?.value||'';
  const img  = (document.getElementById('ap_img')?.value||'').trim();
  const desc = (document.getElementById('ap_desc')?.value||'').trim();
  const credsRaw=(document.getElementById('ap_creds')?.value||'');

  if (!name)  { if(msg) msg.innerHTML='<span style="color:#f87171">⚠️ กรุณากรอกชื่อสินค้า</span>'; return; }
  if (!price) { if(msg) msg.innerHTML='<span style="color:#f87171">⚠️ กรุณากรอกราคาสินค้า</span>'; return; }

  /* parse credentials */
  const credentials=[];
  credsRaw.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
    const sep=line.indexOf(':');
    if (sep>0) credentials.push({name:line.slice(0,sep).trim(), code:line.slice(sep+1).trim()});
    else       credentials.push({name:'', code:line});
  });
  const stock=credentials.length || parseInt(document.getElementById('ap_stock')?.value||'0');

  const prods=LS.get('alexa_products')||[];
  prods.push({id:'p'+Date.now(), name, price, originalPrice:orig, stock, sold:0, category:cat, img, desc, credentials});
  LS.set('alexa_products',prods);

  /* clear form */
  ['ap_name','ap_price','ap_orig','ap_img','ap_desc','ap_creds'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  const stockEl=document.getElementById('ap_stock'); if(stockEl) stockEl.value='0';
  if(msg) msg.innerHTML=`<span style="color:var(--green-ok)">✅ เพิ่มสินค้าสำเร็จ! (รหัส ${credentials.length} ชุด)</span>`;
  setTimeout(()=>{ if(msg) msg.innerHTML=''; },3000);

  renderProductTable();
  renderHomeCategoryCards();
  renderStats();
  showToast('✅ เพิ่มสินค้าสำเร็จ','success');
}

function adminAddCategory() {
  const msg  = document.getElementById('addCatMsg');
  const name = (document.getElementById('ac_name')?.value||'').trim();
  const icon = (document.getElementById('ac_icon')?.value||'').trim()||'📦';
  const img  = (document.getElementById('ac_img')?.value||'').trim();
  if (!name) { if(msg) msg.innerHTML='<span style="color:#f87171">⚠️ กรุณากรอกชื่อหมวดหมู่</span>'; return; }
  const cats=LS.get('alexa_categories')||[];

  /* update dropdown */

function renderProductTable() {
  const prods=LS.get('alexa_products')||[];
  const header=document.getElementById('productTableHeader');
  const wrap  =document.getElementById('productTableWrap');
  if (!wrap) return;
  if (header) header.textContent=`รายการสินค้า (${prods.length} ชิ้น)`;
  if (!prods.length) { wrap.innerHTML=`<div class="empty-state"><div class="empty-icon">📦</div><p>ยังไม่มีสินค้า</p></div>`; return; }

  const table=document.createElement('table');
  table.className='admin-table';
  table.innerHTML=`<thead><tr><th>ชื่อ</th><th>ราคา</th><th>สต็อก</th><th>รหัส</th><th>ขาย</th><th>จัดการ</th></tr></thead>`;
  const tbody=document.createElement('tbody');

  prods.forEach(p=>{
    const credCount=(p.credentials||[]).length;
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td style="font-size:.85rem">${p.name}</td>
      <td>${p.price}฿</td>
      <td><input type="number" value="${p.stock}" min="0"
        style="width:52px;background:var(--dark-bg);border:1px solid var(--border);color:var(--text-light);border-radius:4px;padding:.2rem .3rem"
        data-pid="${p.id}"></td>
      <td><span style="color:var(--gold);font-weight:700">${credCount} ชุด</span>
        <button class="action-btn" style="margin-left:.3rem;color:#4ade80;border-color:#4ade80" data-cred="${p.id}">🔑</button></td>
      <td>${p.sold||0}</td>
      <td style="white-space:nowrap">
        <button class="action-btn" data-edit="${p.id}">✏️</button>
        <button class="action-btn danger" data-del="${p.id}">🗑️</button>
      </td>`;
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.innerHTML='';
  wrap.appendChild(table);

  /* bind events */
  wrap.querySelectorAll('input[data-pid]').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const prods2=LS.get('alexa_products')||[];
      const i=prods2.findIndex(p=>p.id===inp.dataset.pid);
      if(i!==-1){ prods2[i].stock=parseInt(inp.value)||0; LS.set('alexa_products',prods2); }
      showToast('💾 บันทึกสต็อกแล้ว','success');
    });
  });
  wrap.querySelectorAll('[data-cred]').forEach(btn=>btn.addEventListener('click',()=>adminManageCreds(btn.dataset.cred)));
  wrap.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click',()=>adminEditPrice(btn.dataset.edit)));
  wrap.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click',()=>adminDeleteProduct(btn.dataset.del)));
}

function adminEditPrice(id) {
  const prods=LS.get('alexa_products')||[];
  const p=prods.find(x=>x.id===id); if(!p) return;
  const val=parseInt(prompt(`แก้ไขราคา "${p.name}"\nปัจจุบัน: ${p.price} บาท\nราคาใหม่:`));
  if (!val||val<0) { showToast('⚠️ ราคาไม่ถูกต้อง','error'); return; }
  const i=prods.findIndex(x=>x.id===id);
  prods[i].price=val; LS.set('alexa_products',prods);
  showToast(`✅ แก้ราคาเป็น ${val} บาท`,'success'); renderProductTable();
}

function adminDeleteProduct(id) {
  const prods=LS.get('alexa_products')||[];
  const p=prods.find(x=>x.id===id);
  if (!p||!confirm(`ลบ "${p.name}"?`)) return;
  LS.set('alexa_products',prods.filter(x=>x.id!==id));
  showToast('🗑️ ลบสินค้าแล้ว'); renderProductTable(); renderStats();
}

function renderCredList(pid) {
  const prods=LS.get('alexa_products')||[];
  const p=prods.find(x=>x.id===pid); if(!p) return;
  const creds=p.credentials||[];
  const listEl=document.getElementById(`credList_${pid}`); if(!listEl) return;

  if (!creds.length) {
    listEl.innerHTML=`<div style="text-align:center;padding:1.5rem;color:var(--text-dim);background:var(--dark-bg);border-radius:8px;border:1px dashed var(--border)">ยังไม่มีรหัสในระบบ</div>`;
    return;
  }
  listEl.innerHTML=`<div style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem">
    ${creds.map((c,i)=>`
      <div style="background:var(--dark-bg);border:1px solid var(--border);border-radius:8px;padding:.75rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap">
        <div>
          <div style="font-size:.75rem;color:var(--text-dim)">ลำดับที่ ${i+1}${i===0?' <span style="color:#4ade80">(ถัดไป)</span>':''}</div>
          ${c.name?`<div style="font-size:.85rem">👤 ${c.name}</div>`:''}
          <div style="font-family:monospace;font-size:.9rem;color:var(--gold);word-break:break-all">🔐 ${c.code}</div>
        </div>
        <button class="action-btn danger" data-idx="${i}">🗑️</button>
      </div>`).join('')}
  </div>`;
  listEl.querySelectorAll('[data-idx]').forEach(btn=>{
    btn.addEventListener('click',()=>adminDeleteCred(pid,parseInt(btn.dataset.idx)));
  });
}

function adminAddOneCred(pid) {
  const nameEl=document.getElementById(`cred_name_${pid}`);
  const codeEl=document.getElementById(`cred_code_${pid}`);
  const name=(nameEl?.value||'').trim();
  const code=(codeEl?.value||'').trim();
  if (!code) { showToast('⚠️ กรุณากรอกรหัสผ่าน/Code','error'); return; }
  const prods=LS.get('alexa_products')||[];
  const i=prods.findIndex(p=>p.id===pid); if(i===-1) return;
  if (!prods[i].credentials) prods[i].credentials=[];
  prods[i].credentials.push({name,code});
  prods[i].stock=prods[i].credentials.length;
  LS.set('alexa_products',prods);
  if(nameEl) nameEl.value=''; if(codeEl) codeEl.value='';
  showToast('✅ เพิ่มรหัสสำเร็จ','success');
  renderCredList(pid); renderProductTable();
}

function adminDeleteCred(pid,index) {
  if (!confirm(`ลบรหัสลำดับที่ ${index+1}?`)) return;
  const prods=LS.get('alexa_products')||[];
  const i=prods.findIndex(p=>p.id===pid); if(i===-1) return;
  prods[i].credentials.splice(index,1);
  prods[i].stock=prods[i].credentials.length;
  LS.set('alexa_products',prods);
  showToast('🗑️ ลบรหัสแล้ว'); renderCredList(pid); renderProductTable();
}

function adminBulkCredModal(pid) {
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:3000;display:flex;align-items:center;justify-content:center;padding:1rem';
  overlay.innerHTML=`

      <textarea id="bulkCredText" class="form-input" rows="8" style="resize:vertical;font-family:monospace;font-size:.85rem" placeholder="PlayerA:pass123&#10;PlayerB:pass456&#10;onlycode789"></textarea>
      <div style="display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap">
        <button class="btn-primary" id="btnSaveBulk">💾 บันทึกทั้งหมด</button>
        <button class="btn-secondary" id="btnCancelBulk">ยกเลิก</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#btnCancelBulk').addEventListener('click',()=>overlay.remove());
  overlay.querySelector('#btnSaveBulk').addEventListener('click',()=>{
    const lines=(document.getElementById('bulkCredText')?.value||'').split('\n').map(l=>l.trim()).filter(Boolean);
    if (!lines.length) { showToast('⚠️ ไม่มีรหัสให้บันทึก','error'); return; }
    const prods=LS.get('alexa_products')||[];
    const i=prods.findIndex(p=>p.id===pid); if(i===-1) return;
    if (!prods[i].credentials) prods[i].credentials=[];
    lines.forEach(line=>{
      const sep=line.indexOf(':');
      if (sep>0) prods[i].credentials.push({name:line.slice(0,sep).trim(),code:line.slice(sep+1).trim()});
      else       prods[i].credentials.push({name:'',code:line});
    });
    prods[i].stock=prods[i].credentials.length;
    LS.set('alexa_products',prods);
    overlay.remove();
    showToast(`✅ เพิ่ม ${lines.length} รหัสสำเร็จ`,'success');
    renderCredList(pid); renderProductTable();
  });
}
